<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <style>
    @font-face {
      font-family: 'Pixelify Sans';
      src: url('assets/fonts/PixelifySans-Variable.ttf') format('truetype');
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 0;
      font-family: 'Pixelify Sans', monospace;
      background: #07111f;
      overflow: hidden;
      position: relative;
    }

    /* ── Background orbs ───────────────────────── */
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.2; animation: float 12s ease-in-out infinite; }
    .orb-1 { width: 240px; height: 240px; background: radial-gradient(circle, #229ed9, #2563eb); top: -100px; left: -90px; }
    .orb-2 { width: 190px; height: 190px; background: radial-gradient(circle, #14b8a6, #229ed9); bottom: -70px; right: -60px; animation-delay: -4s; }
    .orb-3 { width: 130px; height: 130px; background: radial-gradient(circle, #6366f1, #229ed9); top: 46%; right: -50px; animation-delay: -7s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(15px, -20px) scale(1.05); }
      66%       { transform: translate(-10px, 10px) scale(0.95); }
    }

    /* ── Neon rotating border ──────────────────── */
    @property --neon-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes neon-rotate { to { --neon-angle: 360deg; } }

    .card-wrapper {
      position: relative;
      margin: 14px;
      border-radius: 21px;
      padding: 1px;
      background: linear-gradient(145deg, rgba(56,189,248,.58), rgba(99,102,241,.25) 48%, rgba(255,255,255,.08));
      box-shadow:
        0 18px 55px rgba(0, 0, 0, 0.38),
        0 0 32px rgba(34, 158, 217, 0.12);
    }

    .card-wrapper.active-glow {
      background: linear-gradient(145deg, rgba(56,189,248,.9), rgba(37,99,235,.5), rgba(20,184,166,.4));
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 34px rgba(34, 158, 217, 0.28);
    }

    /* ── Main card ─────────────────────────────── */
    .card {
      position: relative;
      background: rgba(9, 20, 35, 0.97);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 19px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Header ────────────────────────────────── */
    .header { display: flex; align-items: center; gap: 11px; margin-bottom: 17px; }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(145deg, #229ed9, #2563eb);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4);
      flex-shrink: 0;
      animation: logo-pulse 3s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { box-shadow: 0 4px 15px rgba(41, 121, 255, 0.4); }
      50%       { box-shadow: 0 4px 25px rgba(124, 58, 237, 0.6); }
    }

    .header-text { min-width: 0; }
    .header-text h3 { font-size: 14px; font-weight: 750; color: #f8fafc; letter-spacing: 0.1px; }
    .header-text > span { font-size: 10px; color: rgba(226,232,240,0.46); letter-spacing: 0.7px; text-transform: uppercase; }
    .local-badge {
      margin-left: auto; padding: 4px 7px; border-radius: 7px;
      background: rgba(20,184,166,.1); border: 1px solid rgba(45,212,191,.2);
      color: #5eead4; font-size: 8.5px; line-height: 1; font-weight: 800;
      letter-spacing: .8px;
    }

    /* ── Status badge ──────────────────────────── */
    .status-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      transition: all 0.4s ease;
      margin-bottom: 13px; width: 100%;
    }
    .status-badge.idle   { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .status-badge.active { background: rgba(41,121,255,0.15);  color: #60a5fa;               border: 1px solid rgba(41,121,255,0.3); }
    .status-badge.done   { background: rgba(16,185,129,0.15);  color: #34d399;               border: 1px solid rgba(16,185,129,0.3); }
    .status-badge.error  { background: rgba(239,68,68,0.15);   color: #f87171;               border: 1px solid rgba(239,68,68,0.3); }

    .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .dot.pulse { animation: dot-pulse 1.2s ease-in-out infinite; }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%       { transform: scale(1.5); opacity: 0.6; }
    }

    /* ── Counter ───────────────────────────────── */
    .counter-display {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 13px;
      display: flex; align-items: center; justify-content: space-between;
      min-height: 52px; transition: all 0.4s ease;
    }
    .counter-display.lit { background: rgba(41,121,255,0.08); border-color: rgba(41,121,255,0.25); }
    .counter-label { font-size: 11px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.8px; }
    .counter-value {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #2979ff, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1; opacity: 0; transition: all 0.4s ease;
    }
    .counter-value.visible { opacity: 1; animation: count-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes count-in {
      from { transform: scale(0.6) translateY(10px); opacity: 0; }
      to   { transform: scale(1) translateY(0);      opacity: 1; }
    }
    .counter-icon { font-size: 22px; opacity: 0.6; }

    /* ── Progress bar ──────────────────────────── */
    .progress-bar {
      height: 3px; background: rgba(255,255,255,0.06);
      border-radius: 2px; margin-bottom: 16px;
      overflow: hidden; opacity: 0; transition: opacity 0.3s ease;
    }
    .progress-bar.visible { opacity: 1; }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #2979ff, #7c3aed, #06b6d4);
      background-size: 200% 100%; border-radius: 2px;
      animation: shimmer-bar 2s linear infinite;
    }
    .progress-fill.indeterminate {
      width: 40%;
      animation: progress-slide 1.5s ease-in-out infinite, shimmer-bar 2s linear infinite;
    }
    @keyframes progress-slide {
      0%   { transform: translateX(-150%); }
      100% { transform: translateX(350%); }
    }
    @keyframes shimmer-bar {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Buttons ───────────────────────────────── */
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      position: relative; width: 100%; padding: 11px 16px;
      border: 1px solid transparent; border-radius: 11px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      letter-spacing: 0.3px; overflow: hidden;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit;
    }
    .btn::before { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.2s ease; }
    .btn:hover:not(:disabled)::before { background: rgba(255,255,255,0.08); }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0); animation: ripple-anim 0.5s linear;
      pointer-events: none;
    }
    @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

    .btn-start { background: linear-gradient(135deg, #229ed9 0%, #2563eb 100%); color: #fff; box-shadow: 0 8px 22px rgba(34,158,217,0.24); }
    .btn-start:hover:not(:disabled) { box-shadow: 0 10px 28px rgba(34,158,217,0.36); transform: translateY(-1px); }
    .btn-finish { background: rgba(16,185,129,.1); border-color: rgba(52,211,153,.23); color: #6ee7b7; box-shadow: none; }
    .btn-finish:hover:not(:disabled) { background: rgba(16,185,129,.18); border-color: rgba(52,211,153,.38); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: default; transform: none !important; box-shadow: none !important; }
    .btn-icon { font-size: 15px; line-height: 1; }
    .btn-finish.collecting .btn-icon { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* ── Divider / Tip ─────────────────────────── */
    .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); margin: 14px 0; }
    .tip { font-size: 10.5px; color: rgba(226,232,240,0.38); text-align: center; line-height: 1.5; letter-spacing: 0.1px; }

    /* ── Toast ─────────────────────────────────── */
    .toast {
      position: fixed; bottom: 12px; left: 12px; right: 12px;
      background: rgba(30,30,46,0.95); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 10px 14px; font-size: 12px; color: rgba(255,255,255,0.8);
      z-index: 100; transform: translateY(60px); opacity: 0;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; gap: 8px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(16,185,129,0.4); }
    .toast.error-t { border-color: rgba(239,68,68,0.4); }

    /* ── Wave ──────────────────────────────────── */
    .wave-container { display: none; align-items: center; justify-content: center; gap: 3px; height: 20px; }
    .wave-container.visible { display: flex; }
    .wave-bar { width: 3px; height: 100%; background: linear-gradient(to top, #2979ff, #7c3aed); border-radius: 2px; animation: wave 1.2s ease-in-out infinite; }
    .wave-bar:nth-child(1) { animation-delay: 0s; }
    .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .wave-bar:nth-child(5) { animation-delay: 0.6s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.3); opacity: 0.5; }
      50%       { transform: scaleY(1);   opacity: 1;   }
    }

    /* ══════════════════════════════════════════════
       INTRO OVERLAY
    ══════════════════════════════════════════════ */
    .intro-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: #0a0a0f;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding: 24px 20px 20px;
      animation: intro-in 0.5s ease;
    }
    .intro-overlay.hiding { animation: intro-out 0.4s ease forwards; }
    @keyframes intro-in  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes intro-out { from { opacity: 1; } to { opacity: 0; } }

    /* Intro logo */
    .intro-logo-wrap { text-align: center; margin-bottom: 22px; flex-shrink: 0; }
    .intro-logo-icon {
      width: 60px; height: 60px; margin: 0 auto 10px;
      background: linear-gradient(135deg, #2979ff, #7c3aed);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 0 30px rgba(41,121,255,0.55), 0 0 70px rgba(124,58,237,0.30);
      animation: logo-pulse 2s ease-in-out infinite;
    }
    .intro-logo-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: 0.4px; }
    .intro-logo-sub  { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 3px; }

    /* ── Language screen ──────────────────────── */
    #langScreen { width: 100%; text-align: center; animation: slide-up 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes slide-up {
      from { transform: translateY(24px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .lang-prompt     { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 3px; }
    .lang-prompt-sub { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 22px; }

    .lang-row { display: flex; gap: 10px; }
    .lang-btn {
      flex: 1; padding: 13px 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      color: #fff; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
    }
    .lang-btn:hover {
      background: rgba(41,121,255,0.15);
      border-color: rgba(41,121,255,0.55);
      box-shadow: 0 0 22px rgba(41,121,255,0.28), 0 0 8px rgba(124,58,237,0.20);
      transform: translateY(-2px);
    }
    .lang-btn:active { transform: scale(0.97); }
    .lang-flag { font-size: 20px; }

    /* ── Steps screen ─────────────────────────── */
    #stepsScreen { width: 100%; text-align: center; }

    .step-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 24px 18px 20px;
      margin-bottom: 18px;
      height: 192px;
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: step-enter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes step-enter {
      from { transform: translateX(28px); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }

    .step-icon {
      font-size: 42px; margin-bottom: 12px;
      display: block;
      animation: icon-pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes icon-pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .step-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 9px; }
    .step-desc  { font-size: 12px; color: rgba(255,255,255,0.48); line-height: 1.65; }
    .step-hl    { color: #60a5fa; font-weight: 600; }
    .step-warn  { color: #f59e0b; font-weight: 600; }

    /* Progress dots */
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,0.18);
      transition: all 0.35s ease;
    }
    .step-dot.active {
      width: 22px; border-radius: 3px;
      background: linear-gradient(90deg, #2979ff, #7c3aed);
    }

    /* Intro CTA button */
    .intro-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #2979ff, #7c3aed);
      border: none; border-radius: 13px;
      color: #fff; font-size: 14px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 22px rgba(41,121,255,0.42);
      transition: all 0.3s ease;
      letter-spacing: 0.4px;
    }
    .intro-btn:hover  { box-shadow: 0 6px 30px rgba(41,121,255,0.58); transform: translateY(-1px); }
    .intro-btn:active { transform: scale(0.97); }

    /* ── Intro panels wrapper ─────────────────────── */
    .intro-panels {
      width: 100%;
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* ── Language switch (always-visible, absolute) ─ */
    .lang-switch-btn {
      position: absolute;
      top: 14px; right: 14px;
      padding: 5px 9px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 9px;
      color: rgba(255,255,255,0.5);
      font-size: 10px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      letter-spacing: 0.6px;
      transition: all 0.25s ease;
    }
    .lang-switch-btn:hover {
      background: rgba(41,121,255,0.15);
      border-color: rgba(41,121,255,0.45);
      color: rgba(255,255,255,0.85);
      box-shadow: 0 0 12px rgba(41,121,255,0.2);
    }

    /* ── Main UI language button ────────────────────── */
    .header-lang-btn {
      margin-left: 0;
      padding: 3px 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px;
      color: rgba(255,255,255,0.38);
      font-size: 10px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      letter-spacing: 0.6px;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .header-lang-btn:hover {
      background: rgba(41,121,255,0.12);
      border-color: rgba(41,121,255,0.35);
      color: rgba(255,255,255,0.7);
    }

    .hidden { display: none !important; }

    /* ── Analyze button ──────────────────────────── */
    .btn-analyze { background: rgba(99,102,241,.12); border-color: rgba(129,140,248,.26); color: #a5b4fc; box-shadow: none; }
    .btn-analyze:hover:not(:disabled) { background: rgba(99,102,241,.2); border-color: rgba(129,140,248,.42); transform: translateY(-1px); }
    .btn-analyze.analyzing .btn-icon { animation: spin 1s linear infinite; }

    /* ── Stop / Clear row ────────────────────────── */
    .btn-row-2 { display: flex; gap: 8px; }
    .btn-row-2 .btn { font-size: 12px; padding: 9px 12px; }
    .btn-stop  { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); color: #fff; box-shadow: 0 4px 16px rgba(239,68,68,0.28); }
    .btn-stop:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(239,68,68,0.45); transform: translateY(-1px); }
    .btn-clear { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13); color: rgba(255,255,255,0.6); }
    .btn-clear:hover:not(:disabled) { background: rgba(255,255,255,0.13); color: #fff; }

    /* ── Results panel ───────────────────────────── */
    .results-panel {
      margin-top: 12px;
      max-height: 420px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }
    .results-panel::-webkit-scrollbar { width: 4px; }
    .results-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .r-card {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
    }
    .r-card-header {
      font-size: 10.5px; font-weight: 700;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }

    /* Fraud ring */
    .fraud-row { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .fraud-ring {
      width: 68px; height: 68px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: conic-gradient(#00d4aa 0deg, rgba(255,255,255,0.08) 0deg);
      transition: background 0.6s ease;
    }
    .fraud-ring-inner {
      width: 50px; height: 50px; border-radius: 50%;
      background: #0d0d16;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: 800;
    }
    .fraud-info { flex: 1; }
    .fraud-risk-label { font-size: 12px; font-weight: 700; margin-bottom: 7px; }
    .fraud-prog-wrap { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .fraud-prog-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
    .fraud-factors { margin-top: 8px; }
    .fraud-factor {
      font-size: 10.5px; color: rgba(255,255,255,0.45);
      line-height: 1.55; padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .fraud-factor:last-child { border-bottom: none; }

    /* Stats grid */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .stat-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px; }
    .stat-label { font-size: 9.5px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 3px; }
    .stat-value { font-size: 14px; font-weight: 700; color: #e8e8e8; }
    .stat-badge { font-size: 9.5px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 3px; font-weight: 600; }

    /* Reaction bars */
    .react-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .react-emoji { font-size: 14px; width: 20px; flex-shrink: 0; text-align: center; }
    .react-bar-wrap { flex: 1; height: 8px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
    .react-bar-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #4a9eff, #9b59b6); transition: width 0.5s ease; }
    .react-pct { font-size: 10px; color: rgba(255,255,255,0.4); width: 28px; text-align: right; flex-shrink: 0; }

    /* Hour chart */
    .hour-chart { display: flex; align-items: flex-end; gap: 2px; height: 52px; margin-top: 8px; }
    .h-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .h-bar { width: 100%; border-radius: 2px 2px 0 0; background: rgba(0,212,170,0.55); min-height: 2px; transition: height 0.4s ease; }
    .h-bar.peak { background: linear-gradient(to top, #00d4aa, #00a8ff); opacity: 1; }

    /* Content bars */
    .content-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .content-label { font-size: 10.5px; color: rgba(255,255,255,0.45); width: 70px; flex-shrink: 0; }
    .content-bar-wrap { flex: 1; height: 6px; background: rgba(255,255,255,0.07); border-radius: 3px; overflow: hidden; }
    .content-bar-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4a9eff, #7c3aed); transition: width 0.5s ease; }
    .content-pct { font-size: 10px; color: rgba(255,255,255,0.5); width: 28px; text-align: right; flex-shrink: 0; }

    /* Back / Export row */
    .results-actions { display: flex; gap: 8px; }
    .results-actions .btn-back { flex: 1; }
    .btn-back {
      padding: 10px; margin-top: 4px; margin-bottom: 4px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: rgba(255,255,255,0.55);
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.25s ease; display: block;
    }
    .btn-back:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); }
    .btn-export {
      padding: 10px 14px; margin-top: 4px; margin-bottom: 4px;
      background: rgba(41,121,255,0.12); border: 1px solid rgba(41,121,255,0.28);
      border-radius: 12px; color: rgba(100,160,255,0.9);
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.25s ease; white-space: nowrap;
    }
    .btn-export:hover { background: rgba(41,121,255,0.22); color: #fff; }

    /* Tooltip */
    #tipBox {
      position: fixed; z-index: 999;
      max-width: 214px; padding: 10px 12px;
      background: rgba(15,15,28,0.97); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.13); border-radius: 11px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.55);
      pointer-events: none;
      opacity: 0; transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #tipBox.visible { opacity: 1; transform: translateY(0); }
    #tipTitle  { font-size: 10.5px; font-weight: 700; color: #fff; margin-bottom: 5px; }
    #tipDesc   { font-size: 10px; color: rgba(255,255,255,0.52); line-height: 1.55; margin-bottom: 5px; }
    #tipAffect { font-size: 9.5px; color: rgba(100,168,255,0.85); line-height: 1.5; border-top: 1px solid rgba(255,255,255,0.07); padding-top: 5px; }

    .sched-meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 4px; }

    /* ── Channel header card ─────────────────────── */
    .r-card-channel { text-align: center; padding: 14px 12px; }
    .channel-name { font-size: 13px; font-weight: 700; color: #fff; margin-bottom: 5px; line-height: 1.3; }
    .channel-meta { font-size: 10.5px; color: rgba(255,255,255,0.4); }
    .channel-meta-sep { margin: 0 5px; opacity: 0.4; }

    /* ── Compact pixel UI refinement ───────────────── */
    .card-wrapper { margin: 12px; border-radius: 16px; }
    .card { border-radius: 15px; padding: 18px; }
    .header { margin-bottom: 14px; }
    .logo { border-radius: 7px; }
    .header-text h3 { font-size: 16px; font-weight: 700; letter-spacing: 0; }
    .header-text > span { font-size: 10.5px; font-weight: 600; letter-spacing: .65px; }
    .local-badge { border-radius: 5px; font-size: 9.5px; font-weight: 700; }
    .header-lang-btn { border-radius: 5px; font-size: 10.5px; font-weight: 700; }
    .status-badge { border-radius: 7px; padding: 5px 10px; margin-bottom: 11px; font-size: 12px; font-weight: 600; }
    .counter-display { border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; min-height: 62px; }
    .counter-label { font-size: 12px; font-weight: 600; }
    .counter-value { font-size: 31px; font-weight: 700; }
    .progress-bar { display: none; opacity: 1; margin: 0 0 9px; }
    .progress-bar.visible { display: block; }
    .btn-group { gap: 7px; }
    .btn { padding: 12px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; letter-spacing: .1px; }
    .btn-row-2 { margin-top: 7px; gap: 7px; }
    .btn-row-2 .btn { padding: 10px 12px; font-size: 13px; }
    .divider { margin: 11px 0 8px; }
    .tip { font-size: 11.5px; font-weight: 500; }
    .toast, #tipBox { border-radius: 8px; }
    .intro-overlay { min-height: 480px; }
    .intro-logo-icon { border-radius: 10px; }
    .lang-btn, .step-card, .intro-btn { border-radius: 8px; }
    .intro-logo-name, .step-title { font-weight: 700; }
    .r-card { border-radius: 9px; padding: 13px 14px; }
    .r-card-header { font-size: 11.5px; font-weight: 700; }
    .stat-item { border-radius: 6px; }
    .stat-label { font-size: 10.5px; font-weight: 600; }
    .stat-value { font-size: 16px; font-weight: 700; }
    .btn-back, .btn-export { border-radius: 7px; font-size: 13px; font-weight: 700; }
    .channel-name { font-size: 15px; }
    .channel-meta, .sched-meta, .content-label, .fraud-factor { font-size: 11.5px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- ══ INTRO OVERLAY ════════════════════════════════════════ -->
  <div class="intro-overlay" id="introOverlay">

    <div class="intro-logo-wrap">
      <div class="intro-logo-icon">✈</div>
      <div class="intro-logo-name">Telegram Collector</div>
      <div class="intro-logo-sub">Channel Analytics</div>
    </div>

    <button class="lang-switch-btn hidden" id="langSwitchBtn">🌐 Language</button>

    <div class="intro-panels">

      <!-- Language selection -->
      <div id="langScreen">
        <p class="lang-prompt">Choose your language</p>
        <p class="lang-prompt-sub">Выберите язык</p>
        <div class="lang-row">
          <button class="lang-btn" data-lang="en">
            <span class="lang-flag">🇬🇧</span> English
          </button>
          <button class="lang-btn" data-lang="ru">
            <span class="lang-flag">🇷🇺</span> Русский
          </button>
        </div>
      </div>

      <!-- Steps -->
      <div id="stepsScreen" class="hidden">
        <div class="step-card" id="stepCard">
          <span class="step-icon" id="stepIcon"></span>
          <div class="step-title" id="stepTitle"></div>
          <div class="step-desc"  id="stepDesc"></div>
        </div>
        <div class="step-dots" id="stepDots"></div>
        <button class="intro-btn" id="introNextBtn"></button>
      </div>

    </div>

  </div>

  <!-- ══ MAIN UI ══════════════════════════════════════════════ -->
  <div class="card-wrapper" id="cardWrapper">
    <div class="card">

      <div class="header">
        <div class="logo">✈</div>
        <div class="header-text">
          <h3>Telegram Collector</h3>
          <span>Channel Analytics</span>
        </div>
        <span class="local-badge" id="localBadge">LOCAL</span>
        <button class="header-lang-btn" id="mainLangBtn">EN</button>
      </div>

      <div class="status-badge idle" id="statusBadge">
        <div class="dot" id="statusDot"></div>
        <span id="statusMsg">Ready to collect</span>
      </div>

      <div class="counter-display" id="counterDisplay">
        <div>
          <div class="counter-label" id="counterLabel">Posts collected</div>
          <div class="counter-value" id="postCount">0</div>
        </div>
        <div class="wave-container" id="waveContainer">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
        <div class="counter-icon" id="counterIcon">📊</div>
      </div>

      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="btn-group">
        <button class="btn btn-start" id="startBtn">
          <span class="btn-icon">⬇</span>
          <span id="startBtnText">Start Collection</span>
        </button>
        <button class="btn btn-finish" id="finishBtn" disabled>
          <span class="btn-icon" id="finishIcon">✓</span>
          <span id="finishBtnText">Finish &amp; Download</span>
        </button>
        <button class="btn btn-analyze" id="analyzeBtn" disabled>
          <span class="btn-icon" id="analyzeIcon">📊</span>
          <span id="analyzeBtnText">Analyze</span>
        </button>
      </div>

      <div class="btn-row-2">
        <button class="btn btn-stop" id="stopBtn" disabled>
          <span class="btn-icon">⏹</span>
          <span id="stopBtnText">Stop</span>
        </button>
        <button class="btn btn-clear" id="clearBtn" disabled>
          <span class="btn-icon">🗑</span>
          <span id="clearBtnText">Clear</span>
        </button>
      </div>

      <!-- Results panel -->
      <div class="results-panel hidden" id="resultsPanel">

        <div class="r-card r-card-channel" id="channelHeaderCard">
          <div class="channel-name" id="rChannelName">—</div>
          <div class="channel-meta" id="rChannelMeta"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header" data-tip="cardFraud">🚨 <span id="rLabelFraud">Fraud Score</span></div>
          <div class="fraud-row">
            <div class="fraud-ring" id="fraudRing">
              <div class="fraud-ring-inner" id="fraudScoreNum" data-tip="fraudScore">—</div>
            </div>
            <div class="fraud-info">
              <div class="fraud-risk-label" id="fraudRiskLabel" data-tip="fraudRisk">—</div>
              <div class="fraud-prog-wrap">
                <div class="fraud-prog-fill" id="fraudProgFill"></div>
              </div>
            </div>
          </div>
          <div class="fraud-factors" id="fraudFactors"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header">📈 <span id="rLabelViews">Views</span></div>
          <div class="stats-grid" id="viewsGrid"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header">💬 <span id="rLabelEngage">Engagement</span></div>
          <div class="stats-grid" id="engageGrid"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header">😊 <span id="rLabelReact">Reactions</span></div>
          <div id="reactionsBars"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header">🕐 <span id="rLabelSched">Schedule</span></div>
          <div class="sched-meta" id="schedMeta"></div>
          <div class="hour-chart" id="hourChart"></div>
        </div>

        <div class="r-card">
          <div class="r-card-header">📋 <span id="rLabelContent">Content</span></div>
          <div id="contentBars"></div>
        </div>

        <div class="results-actions">
          <button class="btn-back" id="backBtn" type="button">← <span id="backBtnText">Back</span></button>
          <button class="btn-export" id="exportBtn" type="button">⬇ <span id="exportBtnText">Export</span></button>
        </div>
      </div>

      <div class="divider" id="mainDivider"></div>
      <div class="tip" id="tipText">Open a Telegram channel, then click Start</div>

    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastIcon">✓</span>
    <span id="toastMsg"></span>
  </div>

  <div id="tipBox">
    <div id="tipTitle"></div>
    <div id="tipDesc"></div>
    <div id="tipAffect"></div>
  </div>

  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
